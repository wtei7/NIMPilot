services:
  nimpilot:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./exports:/app/exports
      - ./web:/app/web
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    depends_on:
      - litellm
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    ports:
      - "4000:4000"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    command: ["--config", "/app/config/generated.yaml", "--port", "4000"]
    restart: unless-stopped

networks:
  default:
    name: nimpilot-net
