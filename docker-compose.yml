services:
  nimpilot:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./exports:/app/exports
    env_file:
      - .env
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.75.3
    ports:
      - "4000:4000"
    volumes:
      - ./config:/app/config
    command: ["--config", "/app/config/generated.yaml", "--port", "4000"]
    restart: unless-stopped

networks:
  default:
    name: nimpilot-net