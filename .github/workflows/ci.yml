name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: |
          python -m pip check
          python -m pip_audit -r requirements.txt

      - name: Export test environment
        run: |
          echo "NIMPILOT_NVIDIA_API_KEY=test-key-for-ci" >> $GITHUB_ENV
          echo "NIMPILOT_BENCHMARK_LITELLM_URL=http://localhost:4000" >> $GITHUB_ENV

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          NIMPILOT_NVIDIA_API_KEY: test-key-for-ci
          NIMPILOT_BENCHMARK_LITELLM_URL: http://localhost:4000
