name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags

          latest_tag=$(git tag --merged "$MERGE_SHA" --list | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -Vr | head -n 1 || true)
          latest_version=${latest_tag#v}
          if [ -z "$latest_tag" ]; then
            latest_version="0.0.0"
          fi

          IFS='.' read -r major minor patch <<EOF
          $latest_version
          EOF

          major_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^- \[x\] MAJOR - ' || true)
          minor_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^- \[x\] MINOR - ' || true)
          patch_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^- \[x\] PATCH - ' || true)
          release_count=$((major_count + minor_count + patch_count))

          if [ "$release_count" -ne 1 ]; then
            echo "Select exactly one release level: MAJOR, MINOR, or PATCH."
            exit 1
          elif [ "$major_count" -eq 1 ]; then
            version="$((major + 1)).0.0"
          elif [ "$minor_count" -eq 1 ]; then
            version="$major.$((minor + 1)).0"
          elif [ "$patch_count" -eq 1 ]; then
            version="$major.$minor.$((patch + 1))"
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ env.VERSION }}"
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: "NIMPilot v${{ env.VERSION }}"
          body: |
            NIMPilot v${{ env.VERSION }} 릴리스

            ## 주요 변경 사항
            - 릴리스 노트는 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)를 참조하세요.

          generate_release_notes: true
          draft: false
          prerelease: false
