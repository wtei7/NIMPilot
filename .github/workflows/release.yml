name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NIMPilot v${{ env.VERSION }}"
          body: |
            NIMPilot v${{ env.VERSION }} 릴리스

            ## 주요 변경 사항
            - 릴리스 노트는 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)를 참조하세요.

          generate_release_notes: true
          draft: false
          prerelease: false