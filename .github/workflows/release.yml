name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release level
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          major_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^- \[x\] MAJOR - ' || true)
          minor_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^- \[x\] MINOR - ' || true)
          patch_count=$(printf '%s\n' "$PR_BODY" | grep -Ec '^- \[x\] PATCH - ' || true)
          release_count=$((major_count + minor_count + patch_count))

          if [ "$release_count" -ne 1 ]; then
            echo "Select exactly one release level: MAJOR, MINOR, or PATCH."
            exit 1
          elif [ "$major_count" -eq 1 ]; then
            echo "RELEASE_LEVEL=major" >> "$GITHUB_ENV"
          elif [ "$minor_count" -eq 1 ]; then
            echo "RELEASE_LEVEL=minor" >> "$GITHUB_ENV"
          elif [ "$patch_count" -eq 1 ]; then
            echo "RELEASE_LEVEL=patch" >> "$GITHUB_ENV"
          fi

      - name: Reserve release version
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 10); do
            git fetch --force origin main --tags
            latest_tag=$(
              while read -r commit; do
                git tag --points-at "$commit"
              done < <(git rev-list --first-parent origin/main) |
                grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' |
                sort -Vr |
                head -n 1 || true
            )
            latest_version=${latest_tag#v}
            latest_version=${latest_version:-0.0.0}
            IFS='.' read -r major minor patch <<< "$latest_version"

            case "$RELEASE_LEVEL" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac

            tag="v$version"
            git tag "$tag" "$MERGE_SHA"
            if git push origin "refs/tags/$tag"; then
              echo "VERSION=$version" >> "$GITHUB_ENV"
              exit 0
            fi

            if git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"; then
              if [ "$(git rev-list -n 1 "$tag")" = "$MERGE_SHA" ]; then
                echo "VERSION=$version" >> "$GITHUB_ENV"
                exit 0
              fi
            fi

            git tag --delete "$tag"
            sleep "$attempt"
          done

          echo "Unable to reserve a unique release version after 10 attempts."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ env.VERSION }}"
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: "NIMPilot v${{ env.VERSION }}"
          body: |
            NIMPilot v${{ env.VERSION }} release

            ## Changes
            - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes.

          generate_release_notes: true
          draft: false
          prerelease: false
